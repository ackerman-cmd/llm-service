server:
  port: 8087

spring:
  application:
    name: llm-service

  config:
    import: optional:file:./secrets.yaml

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?currentSchema=${POSTGRES_SCHEMA}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${POSTGRES_SCHEMA}
        format_sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: ${POSTGRES_SCHEMA}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: llm-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        max.poll.records: 10
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  kafka:
    topics:
      email-conversation-created: email.conversation.created
      llm-appeal-enriched: llm.appeal.enriched
  email-integration:
    base-url: ${EMAIL_INTEGRATION_URL}
    connect-timeout-millis: 5000
    read-timeout-millis: 30000
  llm:
    base-url: ${LLM_BASE_URL:https://vsellm.ru}
    api-key: ${LLM_API_KEY}
    model: ${LLM_MODEL:gpt-4o-mini}
    connect-timeout-millis: 10000
    read-timeout-millis: 60000
